name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Find Xcode workspace and scheme
        id: project
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          xcodebuild -workspace "$WORKSPACE" -list -json > project.json
          SCHEME=$(jq -r '.workspace.schemes[0]' project.json)
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

      - name: Build unsigned app
        run: |
          set -o pipefail
          WORKSPACE="${{ steps.project.outputs.workspace }}"
          SCHEME="${{ steps.project.outputs.scheme }}"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Show build errors
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "## Xcode errors" >> "$GITHUB_STEP_SUMMARY"
            grep -n -i -E 'error:|failed|fatal error' build.log | tail -40 >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found"
            find build/Build/Products -maxdepth 3 -type d | head -50
            exit 1
          fi
          echo "App: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH" || true
          rm -rf Payload unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry unsigned.ipa Payload
          ls -lh unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: unsigned.ipa
          retention-days: 30
